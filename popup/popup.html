<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trusted Tester Exam Assistant</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <h1>🔍 Trusted Tester</h1>
            <p class="version">Exam Assistant v5.2.0</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" data-tab="analyzer">Analyzer</button>
            <button class="tab-btn" data-tab="manual">Manual Test</button>
            <button class="tab-btn" data-tab="history">History</button>
        </div>

        <!-- Analyzer Tab -->
        <div id="analyzer" class="tab-content active">
            <div class="section">
                <h3>Quick Page Analysis</h3>
                <button id="analyzeCurrentPage" class="btn btn-primary">
                    📊 Analyze Current Page
                </button>
                <div id="quickAnalysisResults" class="quick-results hidden"></div>
            </div>

            <div class="section">
                <h3>Exam Question Analysis</h3>
                <textarea id="examQuestion" placeholder="Paste the complete exam question here, including:

Test ID: X.X
Test Name: x.x.x-test-name
Test Condition: [condition description]

a. [First answer choice]
b. [Second answer choice]  
c. [Third answer choice]
d. [Fourth answer choice]
e. [Fifth answer choice]

Example:
Test ID: 12.A
Test Name: 2.4.2-page-title-defined
Test Condition: A <title> element is defined for the web page.

a. Not Tested - No <title> element is needed for this type of page.
b. Pass - A <title> element is defined for the web page.
c. Fail - No <title> element is defined for this page.
d. Does Not Apply - No <title> element is defined but the page is too short to need one.
e. Fail - More than one <title> element is defined for the web page."></textarea>

                <button id="analyzeQuestion" class="btn btn-success">
                    🎯 Find Best Answer
                </button>
            </div>

            <div id="results" class="results hidden">
                <div class="answer-box">
                    <h3>✅ Recommended Answer</h3>
                    <div id="answerText" class="answer-text"></div>
                </div>

                <div class="analysis-details">
                    <h4>📋 Analysis Details</h4>
                    <div id="analysisDetails"></div>
                </div>

                <div class="confidence">
                    <h4>🎯 Confidence Level</h4>
                    <div id="confidenceBar" class="confidence-bar">
                        <div id="confidenceFill" class="confidence-fill"></div>
                    </div>
                    <span id="confidenceText"></span>
                </div>
            </div>
        </div>

        <!-- Manual Test Tab -->
        <div id="manual" class="tab-content">
            <div class="section">
                <h3>Select Test to Run</h3>
                <select id="testNameSelect" class="select-input">
                    <option value="">-- Select Test by Name --</option>
                    <optgroup label="Category 1: Conforming Alternate Version">
                        <option value="conforming-alternate-version">conforming-alternate-version (1.A)</option>
                    </optgroup>
                    <optgroup label="Category 2: Auto-Playing and Auto-Updating Content">
                        <option value="1.4.2-audio-control">1.4.2-audio-control (2.A)</option>
                        <option value="2.2.2-pause-stop-hide">2.2.2-pause-stop-hide (2.B)</option>
                    </optgroup>
                    <optgroup label="Category 3: Flashing">
                        <option value="2.3.1-three-flashes-or-below-threshold">2.3.1-three-flashes-or-below-threshold (3.A)</option>
                    </optgroup>
                    <optgroup label="Category 4: Keyboard Access and Focus">
                        <option value="2.1.1-keyboard">2.1.1-keyboard (4.A)</option>
                        <option value="2.1.3-keyboard-no-exception">2.1.3-keyboard-no-exception (4.B)</option>
                        <option value="2.1.2-no-keyboard-trap">2.1.2-no-keyboard-trap (4.C)</option>
                        <option value="2.4.7-focus-visible">2.4.7-focus-visible (4.D)</option>
                        <option value="3.2.1-on-focus">3.2.1-on-focus (4.E)</option>
                        <option value="2.4.3-focus-order">2.4.3-focus-order (4.F)</option>
                        <option value="2.1.4-character-key-shortcuts">2.1.4-character-key-shortcuts (4.G)</option>
                    </optgroup>
                    <optgroup label="Category 5: Forms">
                        <option value="3.3.2-labels-or-instructions">3.3.2-labels-or-instructions (5.A)</option>
                        <option value="2.4.6-label-descriptive">2.4.6-label-descriptive (5.B)</option>
                        <option value="1.3.1-programmatic-label">1.3.1-programmatic-label (5.C)</option>
                        <option value="3.2.2-on-input">3.2.2-on-input (5.D)</option>
                        <option value="4.1.2-form-name-role-value">4.1.2-form-name-role-value (5.E)</option>
                        <option value="3.3.1-error-identification">3.3.1-error-identification (5.F)</option>
                        <option value="3.3.3-error-suggestion">3.3.3-error-suggestion (5.G)</option>
                        <option value="3.3.4-error-prevention-legal-financial-data">3.3.4-error-prevention-legal-financial-data (5.H)</option>
                        <option value="1.3.5-identify-input-purpose">1.3.5-identify-input-purpose (5.I)</option>
                    </optgroup>
                    <optgroup label="Category 6: Links">
                        <option value="2.4.4-link-purpose-in-context">2.4.4-link-purpose-in-context (6.A)</option>
                    </optgroup>
                    <optgroup label="Category 7: Images">
                        <option value="1.1.1-meaningful-image-name">1.1.1-meaningful-image-name (7.A)</option>
                        <option value="1.1.1-decorative-image">1.1.1-decorative-image (7.B)</option>
                        <option value="1.1.1-captcha">1.1.1-captcha (7.C)</option>
                        <option value="1.4.5-images-of-text">1.4.5-images-of-text (7.D)</option>
                        <option value="4.1.2-image-name-role-value">4.1.2-image-name-role-value (7.E)</option>
                    </optgroup>
                    <optgroup label="Category 8: Adjustable Time Limits">
                        <option value="2.2.1-timing-adjustable">2.2.1-timing-adjustable (8.A)</option>
                    </optgroup>
                    <optgroup label="Category 9: Repetitive Content">
                        <option value="2.4.1-bypass-blocks">2.4.1-bypass-blocks (9.A)</option>
                    </optgroup>
                    <optgroup label="Category 10: Content Structure">
                        <option value="2.4.6-heading-purpose">2.4.6-heading-purpose (10.A)</option>
                        <option value="1.3.1-visual-headings-programmatic">1.3.1-visual-headings-programmatic (10.B)</option>
                        <option value="1.3.1-heading-level">1.3.1-heading-level (10.C)</option>
                        <option value="1.3.1-lists">1.3.1-lists (10.D)</option>
                    </optgroup>
                    <optgroup label="Category 11: Language">
                        <option value="3.1.1-language-of-page">3.1.1-language-of-page (11.A)</option>
                        <option value="3.1.2-language-of-parts">3.1.2-language-of-parts (11.B)</option>
                    </optgroup>
                    <optgroup label="Category 12: Page Titles, Frames, and iFrames">
                        <option value="2.4.2-page-title-defined">2.4.2-page-title-defined (12.A)</option>
                        <option value="2.4.2-page-title-descriptive">2.4.2-page-title-descriptive (12.B)</option>
                        <option value="4.1.2-frame-title">4.1.2-frame-title (12.C)</option>
                        <option value="4.1.2-iframe-title">4.1.2-iframe-title (12.D)</option>
                    </optgroup>
                    <optgroup label="Category 13: Sensory Characteristics and Contrast">
                        <option value="1.3.3-sensory-characteristics">1.3.3-sensory-characteristics (13.A)</option>
                        <option value="1.4.1-use-of-color">1.4.1-use-of-color (13.B)</option>
                        <option value="1.4.3-contrast-minimum">1.4.3-contrast-minimum (13.C)</option>
                        <option value="1.4.11-non-text-contrast">1.4.11-non-text-contrast (13.D)</option>
                    </optgroup>
                    <optgroup label="Category 14: Tables">
                        <option value="1.3.1-table-identification">1.3.1-table-identification (14.A)</option>
                        <option value="1.3.1-cell-header-association">1.3.1-cell-header-association (14.B)</option>
                        <option value="1.3.1-layout-table-structure">1.3.1-layout-table-structure (14.C)</option>
                    </optgroup>
                    <optgroup label="Category 15: CSS Positioning">
                        <option value="1.3.2-meaningful-sequence">1.3.2-meaningful-sequence (15.A)</option>
                    </optgroup>
                    <optgroup label="Category 16: Pre-Recorded Audio/Video">
                        <option value="1.2.1-audio-video-alternative">1.2.1-audio-video-alternative (16.A)</option>
                        <option value="1.2.2-captions-prerecorded">1.2.2-captions-prerecorded (16.B)</option>
                        <option value="1.2.3-audio-description-prerecorded">1.2.3-audio-description-prerecorded (16.C)</option>
                    </optgroup>
                    <optgroup label="Category 17: Synchronized Media">
                        <option value="1.2.5-media-alternative-prerecorded">1.2.5-media-alternative-prerecorded (17.A)</option>
                        <option value="1.2.4-captions-live">1.2.4-captions-live (17.B)</option>
                    </optgroup>
                    <optgroup label="Category 18: Resize Text">
                        <option value="1.4.4-resize-text">1.4.4-resize-text (18.A)</option>
                    </optgroup>
                    <optgroup label="Category 19: Multiple Ways">
                        <option value="2.4.5-multiple-ways">2.4.5-multiple-ways (19.A)</option>
                    </optgroup>
                    <optgroup label="Category 20: Parsing">
                        <option value="4.1.1-parsing">4.1.1-parsing (20.A)</option>
                    </optgroup>
                </select>

                <button id="runManualTest" class="btn btn-secondary">
                    🔬 Run Test on Current Page
                </button>

                <div id="manualResults" class="manual-results hidden"></div>
            </div>
        </div>

        <!-- History Tab -->
        <div id="history" class="tab-content">
            <div class="section">
                <h3>Recent Analyses</h3>
                <div id="historyList" class="history-list">
                    <p class="empty-state">No analysis history yet</p>
                </div>
                <button id="clearHistory" class="btn btn-danger btn-sm">Clear All History</button>
            </div>
        </div>

        <!-- Status Messages -->
        <div id="statusMessage" class="status-message hidden"></div>
    </div>

    <script src="../lib/testMapping.js"></script>
    <script src="popup.js"></script>
</body>

</html>
